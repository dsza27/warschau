<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juhuu 💖</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffe0ec, #ffd1e3 50%, #ffeccf);
    font-family: "Comic Sans MS", "Segoe UI", system-ui, sans-serif; color: #b0285f; text-align: center;
    overflow: hidden;
  }
  .card {
    background: rgba(255,255,255,.88); border-radius: 28px; padding: 32px 28px; max-width: 460px; width: 92%;
    box-shadow: 0 12px 40px rgba(176,40,95,.25); position: relative; z-index: 2;
  }
  h1 { font-size: 2rem; margin: 12px 0 8px; line-height: 1.3; }
  .big { font-size: 3.4rem; animation: bounce 1s infinite; }
  .gif { width: 100%; max-width: 280px; border-radius: 18px; }
  a { color: #ff4d8d; font-size: .95rem; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .heart { position: fixed; bottom: -40px; font-size: 26px; animation: float linear infinite; z-index: 1; opacity: .8; }
  @keyframes float { to { transform: translateY(-115vh) rotate(25deg); } }
</style>
</head>
<body>
<div class="card">
  <!-- GIF: wie auf der ersten Seite einfach austauschen -->
  <img class="gif" src="gif2.gif" alt="" onerror="this.style.display='none'">
  <div class="big">🥰</div>
  <h1>Wir schaffen das schon irgendwie, mein Bibi! 🐻💖</h1>
  <p>Warschau, wir kommen. ✈️🇵🇱</p>
  <a href="index.html">← zurück</a>
</div>

<script>
  for (let n = 0; n < 30; n++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💕","💗","🌸","✨"][n % 5];
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = 4 + Math.random() * 6 + "s";
    h.style.animationDelay = -Math.random() * 8 + "s";
    document.body.appendChild(h);
  }
</script>
</body>
</html>
