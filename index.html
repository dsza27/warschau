<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eine Frage 💌</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #ffd6e8, #ffe9f3 50%, #fff0d9);
    font-family: "Comic Sans MS", "Segoe UI", system-ui, sans-serif; color: #b0285f; text-align: center;
    overflow: hidden;
  }
  .card {
    background: rgba(255,255,255,.85); border-radius: 28px; padding: 32px 28px; max-width: 460px; width: 92%;
    box-shadow: 0 12px 40px rgba(176,40,95,.2); position: relative; z-index: 2;
  }
  h1 { font-size: 1.9rem; margin: 12px 0 20px; line-height: 1.3; }
  .gif { width: 100%; max-width: 280px; border-radius: 18px; }
  .buttons { display: flex; gap: 16px; justify-content: center; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .btn {
    font-size: 1.3rem; font-family: inherit; border: none; border-radius: 999px; padding: 14px 34px;
    cursor: pointer; text-decoration: none; display: inline-block;
  }
  .ja { background: #ff4d8d; color: #fff; box-shadow: 0 6px 16px rgba(255,77,141,.5); animation: pulse 1.2s infinite; }
  .ja:hover { transform: scale(1.1); }
  .nein { background: #e5e0e3; color: #8c8589; transition: left .25s ease, top .25s ease; z-index: 5; }
  .nein.flying { position: fixed; }
  .slot { display: inline-block; } /* hält den Platz frei, wenn Nein wegspringt */
  .hint { min-height: 1.4em; font-size: .95rem; margin-top: 14px; color: #c44b80; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .heart { position: fixed; bottom: -40px; font-size: 24px; animation: float linear infinite; z-index: 1; opacity: .7; pointer-events: none; }
  @keyframes float { to { transform: translateY(-115vh) rotate(25deg); } }
</style>
</head>
<body>
<div class="card">
  <!-- GIF: Link einfach durch ein eigenes GIF ersetzen (z.B. von giphy.com -> Rechtsklick -> Bildadresse kopieren)
       oder ein GIF in den Ordner legen und src="mein.gif" schreiben. -->
  <img class="gif" src="gif1.gif" alt="" onerror="this.style.display='none'">
  <div style="font-size:3rem">🐻💕</div>
  <h1 style="font-size:1.55rem">Komm bitte zu mir nach Warschau, denn ich vermisse dich und will dich bei mir haben. 💕</h1>
  <div class="buttons">
    <a class="btn ja" id="ja" href="ja.html">Ja 💖</a>
    <span class="slot" id="slot"><button class="btn nein" id="nein" type="button">Nein</button></span>
  </div>
  <div class="hint" id="hint"></div>
</div>

<script>
  const nein = document.getElementById("nein");
  const slot = document.getElementById("slot");
  const ja = document.getElementById("ja");
  const hint = document.getElementById("hint");
  const hints = ["Haha, zu langsam 😘", "Netter Versuch, Bibi 🐻", "Der Button hat Angst 🙈", "Klick lieber auf Ja 💖", "Der will nicht 😝"];
  let count = 0;

  function dodge() {
    // Platz im Layout reservieren, bevor der Button herausspringt
    if (!nein.classList.contains("flying")) {
      slot.style.width = nein.offsetWidth + "px";
      slot.style.height = nein.offsetHeight + "px";
      nein.classList.add("flying");
    }
    const w = nein.offsetWidth, h = nein.offsetHeight, m = 12;
    const jr = ja.getBoundingClientRect();
    let x, y, tries = 0;
    do {
      x = m + Math.random() * (window.innerWidth - w - 2 * m);
      y = m + Math.random() * (window.innerHeight - h - 2 * m);
      tries++;
      // nicht direkt auf den Ja-Button springen
    } while (tries < 30 && x < jr.right + 20 && x + w > jr.left - 20 && y < jr.bottom + 20 && y + h > jr.top - 20);
    nein.style.left = x + "px";
    nein.style.top = y + "px";
    hint.textContent = hints[count++ % hints.length];
  }

  // Maus, Touch und Tastatur: der Button weicht immer aus
  nein.addEventListener("mouseenter", dodge);
  nein.addEventListener("pointerdown", e => { e.preventDefault(); dodge(); });
  nein.addEventListener("touchstart", e => { e.preventDefault(); dodge(); }, { passive: false });
  nein.addEventListener("focus", dodge);
  nein.addEventListener("click", e => { e.preventDefault(); dodge(); });

  // Herzchen
  for (let n = 0; n < 18; n++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💕","💗","🌸"][n % 4];
    h.style.left = Math.random() * 100 + "vw";
    h.style.animationDuration = 6 + Math.random() * 8 + "s";
    h.style.animationDelay = -Math.random() * 10 + "s";
    document.body.appendChild(h);
  }
</script>
</body>
</html>
